# تعريف مجمع الاتصال بـ Node.js مع إبقاء المقابس مفتوحة لمنع استنزاف موارد الشبكة
upstream nodejs_backend {
    server web-api:4000 max_fails=3 fail_timeout=10s;
    keepalive 64; # 64 مقبس TCP مفتوح وجاهز لتقليل زمن الاستجابة ومنع TIME_WAIT
}

# نطاقات تحديد معدل الطلبات لحماية السيرفر من هجمات الإغراق (DDoS Defense)
limit_req_zone $binary_remote_addr zone=api_general:20m rate=150r/m;
limit_req_zone $binary_remote_addr zone=sync_stream:20m rate=400r/m;

server {
    listen 80;
    server_name _;

    # إخفاء تفاصيل خادم الويب لأمان السيرفر
    server_tokens off;

    # 1. ضبط الذاكرة ومقاسات الطلبات لمنع تجميد البيانات الكبيرة
    client_max_body_size 100M;
    client_body_buffer_size 4M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # 2. مهل الاتصال المحمية لنقل كميات البيانات والملفات الضخمة (5 دقائق للعمليات الكبيرة)
    client_body_timeout 300s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    send_timeout 300s;

    # 3. محاذاة مقابس الشبكة وإلغاء التأخير الزمني للـ TCP
    tcp_nopush on;
    tcp_nodelay on;

    # 4. ضغط الـ JSON اللحظي المتدفق (Gzip Engine)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # رؤوس الأمان القياسية (Security Headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # المسار المخصص للمزامنة المتدفقة الفائقة (Streaming Sync Pipeline)
    location /api/v1/sync/ {
        limit_req zone=sync_stream burst=80 nodelay;

        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # ضروري لعمل الـ Keepalive بين Nginx و Node
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # تعطيل التخزين المؤقت على القرص لضمان التدفق المباشر لحظياً في الـ RAM
        proxy_buffering off;
        proxy_request_buffering off; # تدفق البايت مباشرة من جهاز الكاشير إلى معالج الـ Node.js
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # المسار العام لكافة استعلامات الـ API العادية
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_read_timeout 60s;
    }

    # فحص صحة خادم Nginx السريع على الـ Edge
    location /healthz {
        access_log off;
        return 200 "Nginx Edge OK\n";
    }

    # حجب أي ملفات خفية أو حساسة (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
