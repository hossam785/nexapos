# ==============================================================================
# NEXA POS SaaS Cloud Server - Production Nginx Gateway Configuration
# 100-Year High-Throughput Reverse Proxy, WebSocket Gateway, SSL & SPA Delivery
# ==============================================================================

# تحويل ترقية الاتصال للـ WebSockets
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. مجمع اتصالات خادم الـ API السحابي (Node.js Upstream Pool)
upstream nexa_cloud_backend {
    server web-api:4000 max_fails=3 fail_timeout=10s;
    keepalive 64; # إبقاء 64 مقبساً مفتوحاً لمنع TIME_WAIT واستنزاف المنافذ
}

# 2. نطاقات تقنين تدفق الطلبات لحماية السيرفر من هجمات الحرمان من الخدمة (Rate Limiting Zones)
limit_req_zone $binary_remote_addr zone=nexa_api_ratelimit:20m rate=150r/m;
limit_req_zone $binary_remote_addr zone=nexa_auth_ratelimit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=nexa_sync_stream:20m rate=400r/m;

# ==============================================================================
# خادم المنفذ 80: معالجة تحدي Let's Encrypt وإعادة التوجيه الإجباري إلى HTTPS
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # إخفاء تفاصيل خادم الويب
    server_tokens off;

    # مسار فحص صحة Nginx السريع على الـ Edge
    location /healthz {
        access_log off;
        return 200 "Nginx Edge OK\n";
    }

    # مسار التحقق الآلي لشهادات Let's Encrypt (ACME HTTP-01 Challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # إعادة التوجيه الدائم والآمن لكافة المسارات الأخرى إلى HTTPS المشفر
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# خادم المنفذ 443: حركة المرور المشفرة عالي الأداء والأمان
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    server_tokens off;

    # شهادات الأمان (يتم ربطها بمسار الشهادات الصادرة عبر Certbot أو الشهادة المؤقتة)
    ssl_certificate /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;

    # بروتوكولات وتشفير TLS الصارم (TLS 1.2 و 1.3 فقط)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # إدارة جلسات SSL لتقليل استهلاك المعالج وزمن التفاوض (Handshake)
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;

    # ترويسات الأمان القياسية الصارمة لحماية المتصفح والبيانات
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # محاذاة مقابس الشبكة وإلغاء التأخير الزمني للـ TCP
    tcp_nopush on;
    tcp_nodelay on;

    # ضبط الذاكرة ومقاسات الطلبات لنقل حزم التحديثات والمزامنة الكبيرة (500MB)
    client_max_body_size 500M;
    client_body_buffer_size 4M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;

    # مهل الاتصال المحمية
    client_body_timeout 300s;
    client_header_timeout 60s;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    send_timeout 300s;

    # ضغط البيانات اللحظي المتدفق (Gzip Engine)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # توجيه المسار الرئيسي فوراً إلى لوحة تحكم الأسطول
    location = / {
        return 301 /dashboard/;
    }

    # 1. مسار المزامنة المتدفقة الفائقة لحظياً (Streaming Sync Pipeline)
    # حماية من التجميد: تعطيل التخزين المؤقت للـ Buffer على القرص لتدفق مباشر في الـ RAM
    location /api/v1/sync/ {
        limit_req zone=nexa_sync_stream burst=80 nodelay;

        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 15s;
    }

    # 2. بوابة المصادقة وتسجيل الدخول (Super-Admin & Tenant Auth)
    location /api/v1/auth/ {
        limit_req zone=nexa_auth_ratelimit burst=10 nodelay;

        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. البوابة العامة لخدمات الـ API السحابية
    location /api/ {
        limit_req zone=nexa_api_ratelimit burst=40 nodelay;

        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم اتصال WebSockets للتحكم والمراقبة الفورية
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_read_timeout 60s;
    }

    # 4. كاش ممتد للأصول الثابتة للوحة التحكم ذات البصمة المشفرة (Immutable Static Assets)
    location /dashboard/assets/ {
        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 5. تخديم لوحة تحكم أسطول الكاشيرات (Fleet Mission Control SPA)
    location /dashboard {
        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # منع تخزين ملف HTML في الكاش لضمان تسليم آخر تحديث فوري للواجهة
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 6. فحص صحة الخادم على الـ Edge
    location /healthz {
        access_log off;
        return 200 "Nginx Edge HTTPS OK\n";
    }

    # 7. حجب الملفات الحساسة والمخفية تماماً (.git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
