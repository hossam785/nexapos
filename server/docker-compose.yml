services:
  # 1. قاعدة البيانات السحابية المركزية
  postgres:
    image: postgres:16-alpine
    container_name: nexa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexa_saas}
      POSTGRES_USER: ${POSTGRES_USER:-nexa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nexa_pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    expose:
      - "5432" # محجوب عن الإنترنت العام، متاح فقط داخل الشبكة الداخلية
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexa_admin} -d ${POSTGRES_DB:-nexa_saas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexa_internal

  # 2. محرك الكاش اللحظي والـ Token Blacklist
  redis:
    image: redis:7-alpine
    container_name: nexa-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Redis password is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - nexa_redisdata:/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    expose:
      - "6379" # محجوب عن الإنترنت العام
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nexa_internal

  # 3. خادم الـ API متعدد المستأجرين
  web-api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: nexa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      NODE_OPTIONS: "--max-old-space-size=1536"
      DATABASE_URL: postgres://${POSTGRES_USER:-nexa_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexa_saas}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT secret is required}
      LICENSE_SIGNING_KEY: ${LICENSE_SIGNING_KEY:?License private key is required}
      NEXA_LICENSE_PRIVATE_KEY_PEM: ${LICENSE_SIGNING_KEY:?License private key is required}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    expose:
      - "4000" # محجوب خلف Nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexa_internal

  # 4. الـ Reverse Proxy عالي التدفق مع حماية التجميد
  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: nexa-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nexa_ssl_certs:/etc/letsencrypt
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    depends_on:
      - web-api
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - nexa_internal

volumes:
  nexa_pgdata:
  nexa_redisdata:
  nexa_ssl_certs:

networks:
  nexa_internal:
    driver: bridge
