# ==============================================================================
# NEXA POS SaaS Cloud Server - Production Nginx Reverse Proxy Configuration
# Architecture: High-Throughput Node.js Cluster + WebSocket Gateway + SPA Delivery
# ==============================================================================

# 1. تعريف مجمع سيرفرات المعالجة الخلفية (Node.js Upstream Pool)
upstream nexa_cloud_backend {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# 2. مناطق تقنين تدفق الطلبات لمنع هجمات الحرمان من الخدمة (Rate Limiting Zones)
limit_req_zone $binary_remote_addr zone=nexa_api_ratelimit:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=nexa_auth_ratelimit:10m rate=5r/s;

server {
    listen 80;
    listen [::]:80;
    server_name fleet.nexapos.com admin.nexapos.com;

    # توجيه تلقائي إلى اتصال SSL/TLS المشفر
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fleet.nexapos.com admin.nexapos.com;

    # شهادات الأمان والتشفير العالي (TLS 1.2 / TLS 1.3)
    ssl_certificate /etc/letsencrypt/live/fleet.nexapos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.nexapos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ترويسات الأمان الصارمة لحماية المتصفح والأسطول (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # إعدادات ضغط البيانات الفوري لتقليل استهلاك الشبكة (Gzip Compression)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # الحجم الأقصى المسموح به لحزم المزامنة المجمعة ورفع ملفات الـ OTA (500MB)
    client_max_body_size 500M;

    # توجيه المسار الجذري إلى لوحة التحكم
    location = / {
        return 301 /dashboard/;
    }

    # 1. تخديم لوحة تحكم الأسطول (Single Page Application - Fleet Dashboard)
    location /dashboard/ {
        proxy_pass http://nexa_cloud_backend/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # منع تخزين ملف HTML لضمان وصول التحديثات فوراً
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 2. كاش ممتد للأصول الرقمية الثابتة ذات البصمة المشفرة (Immutable Static Assets)
    location ~* ^/dashboard/assets/.+\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        proxy_pass http://nexa_cloud_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 3. بوابات الـ API السحابية والمزامنة والأسطول (Cloud APIs & Sync Ingestion)
    location /api/ {
        limit_req zone=nexa_api_ratelimit burst=40 nodelay;

        proxy_pass http://nexa_cloud_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # دعم اتصال WebSocket اللاتزامني للتنبيهات الفورية (Real-Time Pub/Sub)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # فترات الانتظار لحزم المزامنة الضخمة
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 4. بوابة تسجيل الدخول والأمان (Super-Admin Auth Protection)
    location /api/v1/auth/ {
        limit_req zone=nexa_auth_ratelimit burst=10 nodelay;

        proxy_pass http://nexa_cloud_backend/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. مسار فحص الجاهزية الحي (Load Balancer Health Probe)
    location /health {
        proxy_pass http://nexa_cloud_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # 6. مسار تصدير القياسات لـ Prometheus (مقصور على الشبكة الداخلية)
    location /metrics {
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # allow 127.0.0.1;
        # deny all;

        proxy_pass http://nexa_cloud_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
